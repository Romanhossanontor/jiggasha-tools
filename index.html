<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Image Resizer - JiggashaHelp</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg-body: #f3f4f6;
    --bg-surface: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --radius-lg: 16px;
    --radius-md: 10px;
    --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-body);
    color: var(--text-main);
    line-height: 1.5;
}

/* TOP NAVBAR */
.navbar {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 5%;
    box-shadow: var(--shadow-sm);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
}

.brand span {
    color: var(--primary);
}

/* MAIN LAYOUT */
.container {
    max-width: 1100px;
    margin: 40px auto;
    padding: 0 20px;
}

.header-text {
    text-align: center;
    margin-bottom: 40px;
}

.header-text h1 {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.header-text p {
    color: var(--text-muted);
    margin-top: 8px;
    font-size: 16px;
}

/* APP WORKSPACE */
.workspace {
    background: var(--bg-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    min-height: 600px;
}

/* LEFT: PREVIEW AREA */
.preview-panel {
    padding: 30px;
    border-right: 1px solid var(--border);
    background: #f9fafb;
    display: flex;
    flex-direction: column;
}

.panel-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.drop-zone {
    flex: 1;
    border: 2px dashed #cbd5e1;
    border-radius: var(--radius-md);
    background: var(--bg-surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    position: relative;
    overflow: hidden;
}

.drop-zone:hover {
    border-color: var(--primary);
    background: #eef2ff;
}

.upload-content h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 5px;
}

.upload-content p {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 20px;
}

.btn-outline {
    background: white;
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    box-shadow: var(--shadow-sm);
    pointer-events: none;
}

#imageInput {
    display: none;
}

/* Checkerboard Background for Image Preview */
.image-preview-container {
    display: none;
    width: 100%;
    height: 100%;
    background-color: #fff;
    background-image: 
        linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0), 
        linear-gradient(45deg, #f0f0f0 25%, transparent 25%, transparent 75%, #f0f0f0 75%, #f0f0f0);
    background-size: 20px 20px;
    background-position: 0 0, 10px 10px;
    border-radius: var(--radius-md);
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 10px;
}

#previewImg {
    max-width: 100%;
    max-height: 450px;
    object-fit: contain;
    border-radius: 4px;
}

/* RIGHT: SETTINGS PANEL */
.settings-panel {
    padding: 30px;
    background: var(--bg-surface);
}

.info-box {
    background: #f8fafc;
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
}

.input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.input-with-icon {
    position: relative;
}

.input-with-icon span {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
}

.form-control {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: 0.2s;
    background: #f9fafb;
}

.form-control:focus {
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
}

/* Toggle Switch Styling */
.toggle-wrapper {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8fafc;
    padding: 15px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    margin-bottom: 25px;
}

.toggle-label {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
}

.switch input {
    opacity: 0;
    width: 0;
    height: 0;
}

.slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #cbd5e1;
    transition: .3s;
    border-radius: 34px;
}

.slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .3s;
    border-radius: 50%;
}

input:checked + .slider {
    background-color: var(--primary);
}

input:checked + .slider:before {
    transform: translateX(20px);
}

/* Buttons */
.btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: 0.2s;
}

.btn-primary:hover {
    background: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}

.btn-success {
    width: 100%;
    padding: 14px;
    background: #10b981;
    color: white;
    border: none;
    border-radius: var(--radius-md);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    margin-top: 12px;
    transition: 0.2s;
}

.btn-success:hover {
    background: #059669;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
}

/* Output Data */
.output-meta {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #ecfdf5;
    border: 1px dashed #34d399;
    border-radius: var(--radius-md);
    font-size: 14px;
    color: #065f46;
}

.output-meta strong {
    color: #047857;
}

/* Footer */
footer {
    text-align: center;
    padding: 40px 0;
    color: var(--text-muted);
    font-size: 14px;
}

/* Responsive */
@media(max-width: 850px) {
    .workspace { grid-template-columns: 1fr; }
    .preview-panel { border-right: none; border-bottom: 1px solid var(--border); }
    .drop-zone { min-height: 300px; }
}

@media(max-width: 480px) {
    .input-grid { grid-template-columns: 1fr; }
    .header-text h1 { font-size: 28px; }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a href="#" class="brand">
        <!-- Logo SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
            <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
        </svg>
        Jiggasha<span>Help</span>
    </a>
</nav>

<!-- MAIN CONTENT -->
<div class="container">
    <div class="header-text">
        <h1>Professional Image Resizer</h1>
        <p>Resize, compress, and convert your images with high precision.</p>
    </div>

    <div class="workspace">
        
        <!-- LEFT PANEL -->
        <div class="preview-panel">
            <div class="panel-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                Image Preview
            </div>

            <!-- Upload Zone -->
            <label class="drop-zone" id="dropZone" for="imageInput">
                <div class="upload-content" id="uploadContent">
                    <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M12 12v9"></path><path d="m16 16-4-4-4 4"></path></svg>
                    <h3>Drag & Drop your image here</h3>
                    <p>or click to browse from your device</p>
                    <div class="btn-outline">Select File</div>
                </div>
                
                <!-- Image Preview (Hidden by default) -->
                <div class="image-preview-container" id="previewContainer">
                    <img id="previewImg" alt="Your Image">
                </div>
            </label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <!-- RIGHT PANEL -->
        <div class="settings-panel">
            <div class="panel-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                Resize Settings
            </div>

            <div class="info-box">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <span id="originalSizeText">Upload an image to see details</span>
            </div>

            <div class="form-group">
                <label>Dimensions (Pixels)</label>
                <div class="input-grid">
                    <div class="input-with-icon">
                        <input type="number" id="widthInput" class="form-control" placeholder="Width" min="1">
                        <span>PX</span>
                    </div>
                    <div class="input-with-icon">
                        <input type="number" id="heightInput" class="form-control" placeholder="Height" min="1">
                        <span>PX</span>
                    </div>
                </div>
            </div>

            <div class="toggle-wrapper">
                <div class="toggle-label">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                    Lock Aspect Ratio
                </div>
                <label class="switch">
                    <input type="checkbox" id="ratioToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label>Export Format</label>
                <select id="formatSelect" class="form-control">
                    <option value="image/jpeg">JPG / JPEG (Best for photos)</option>
                    <option value="image/png">PNG (Keeps transparency)</option>
                    <option value="image/webp">WEBP (Best for web size)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Export Quality</label>
                <select id="qualitySelect" class="form-control">
                    <option value="1">100% - Maximum Quality</option>
                    <option value="0.9" selected>90% - High Quality (Recommended)</option>
                    <option value="0.75">75% - Medium Size</option>
                    <option value="0.5">50% - Smallest File Size</option>
                </select>
            </div>

            <button class="btn-primary" onclick="processImage()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                Resize Image
            </button>

            <a id="downloadBtn" class="btn-success" download>
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download Image
            </a>

            <div class="output-meta" id="outputMeta"></div>

        </div>
    </div>
</div>

<footer>
    © 2026 JiggashaHelp — Professional Free Web Tools
</footer>

<script>
// Logic Variables
let sourceImage = new Image();
let origW = 0, origH = 0;
let currentFile = null;

// DOM Elements
const imageInput = document.getElementById('imageInput');
const dropZone = document.getElementById('dropZone');
const uploadContent = document.getElementById('uploadContent');
const previewContainer = document.getElementById('previewContainer');
const previewImg = document.getElementById('previewImg');

const originalSizeText = document.getElementById('originalSizeText');
const widthInput = document.getElementById('widthInput');
const heightInput = document.getElementById('heightInput');
const ratioToggle = document.getElementById('ratioToggle');

const formatSelect = document.getElementById('formatSelect');
const qualitySelect = document.getElementById('qualitySelect');

const downloadBtn = document.getElementById('downloadBtn');
const outputMeta = document.getElementById('outputMeta');

// 1. Handle File Selection
imageInput.addEventListener('change', function(e) {
    if(this.files && this.files[0]) {
        loadFileData(this.files[0]);
    }
});

function loadFileData(file) {
    if(!file.type.match('image.*')) {
        alert("দয়া করে শুধুমাত্র ইমেজ ফাইল (JPG, PNG, WEBP) আপলোড করুন।");
        return;
    }
    currentFile = file;
    const reader = new FileReader();

    reader.onload = function(e) {
        sourceImage.onload = function() {
            origW = sourceImage.naturalWidth;
            origH = sourceImage.naturalHeight;

            // Setup UI
            widthInput.value = origW;
            heightInput.value = origH;
            originalSizeText.innerHTML = `Original: <strong>${origW} × ${origH} px</strong> (${formatBytes(file.size)})`;

            // Setup Preview
            previewImg.src = e.target.result;
            uploadContent.style.display = 'none';
            previewContainer.style.display = 'flex';
            dropZone.style.border = 'none';
            dropZone.style.background = 'transparent';

            // Reset Output buttons
            downloadBtn.style.display = 'none';
            outputMeta.style.display = 'none';
        };
        sourceImage.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

// 2. Handle Dimension Changes (Aspect Ratio Lock)
widthInput.addEventListener('input', function() {
    if(ratioToggle.checked && origW > 0) {
        const w = parseInt(this.value) || 0;
        heightInput.value = Math.round((w * origH) / origW);
    }
});

heightInput.addEventListener('input', function() {
    if(ratioToggle.checked && origH > 0) {
        const h = parseInt(this.value) || 0;
        widthInput.value = Math.round((h * origW) / origH);
    }
});

// 3. Process & Resize Function
function processImage() {
    if(!currentFile) {
        alert("দয়া করে প্রথমে একটি ছবি আপলোড করুন।");
        return;
    }

    const finalW = parseInt(widthInput.value);
    const finalH = parseInt(heightInput.value);

    if(!finalW || !finalH || finalW <= 0 || finalH <= 0) {
        alert("Width এবং Height সঠিকভাবে প্রদান করুন।");
        return;
    }

    // Create hidden canvas for rendering
    const canvas = document.createElement('canvas');
    canvas.width = finalW;
    canvas.height = finalH;
    const ctx = canvas.getContext('2d');

    // High quality rendering settings
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    // Fix transparency issue for JPEG (fill white bg)
    const exportFormat = formatSelect.value;
    if (exportFormat === 'image/jpeg') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, finalW, finalH);
    }

    // Draw the image
    ctx.drawImage(sourceImage, 0, 0, finalW, finalH);

    // Export Data
    const quality = parseFloat(qualitySelect.value);
    
    canvas.toBlob(function(blob) {
        const outputUrl = URL.createObjectURL(blob);
        
        // Setup Download Button
        let ext = exportFormat.split('/')[1];
        if(ext === 'jpeg') ext = 'jpg';
        
        const originalName = currentFile.name.split('.').slice(0, -1).join('.');
        
        downloadBtn.href = outputUrl;
        downloadBtn.download = `${originalName}_resized.${ext}`;
        downloadBtn.style.display = 'flex';

        // Setup Meta Info with inline SVG Checkmark
        outputMeta.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom; margin-right: 4px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> <strong>Success!</strong><br> New Size: ${finalW} × ${finalH} px <br> File Size: ${formatBytes(blob.size)}`;
        outputMeta.style.display = 'block';

        // Optional: Update preview to show the resized image
        previewImg.src = outputUrl;

    }, exportFormat, quality);
}

// Helper: Format Bytes to KB/MB
function formatBytes(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// 4. Drag and Drop Support
dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    if(uploadContent.style.display !== 'none') {
        dropZone.style.borderColor = '#4f46e5';
        dropZone.style.background = '#eef2ff';
    }
});

dropZone.addEventListener('dragleave', (e) => {
    e.preventDefault();
    if(uploadContent.style.display !== 'none') {
        dropZone.style.borderColor = '#cbd5e1';
        dropZone.style.background = '#ffffff';
    }
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    if(e.dataTransfer.files && e.dataTransfer.files[0]) {
        loadFileData(e.dataTransfer.files[0]);
    }
});
</script>

</body>
</html>
