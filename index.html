<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Image Resize Tool - JiggashaHelp</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.tool{
    max-width:650px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.10);
    text-align:center;
}

h1{
    font-size:28px;
}

input[type="file"]{
    width:100%;
    margin:15px 0;
}

input[type="number"]{
    width:120px;
    padding:10px;
    margin:5px;
}

button,
.download{
    display:inline-block;
    padding:12px 20px;
    margin:15px 5px;
    border:none;
    border-radius:7px;
    background:#222;
    color:white;
    cursor:pointer;
    text-decoration:none;
}

canvas{
    max-width:100%;
    margin-top:20px;
    border:1px solid #ddd;
}

#controls{
    display:none;
}
</style>
</head>

<body>

<div class="tool">

<h1>🖼️ Image Resize Tool</h1>

<p>ছবির Width ও Height পরিবর্তন করুন</p>

<input type="file" id="imageInput" accept="image/*">

<div id="controls">

<p>
Width:
<input type="number" id="width">

Height:
<input type="number" id="height">
</p>

<label>
<input type="checkbox" id="ratio" checked>
Aspect Ratio বজায় রাখুন
</label>

<br>

<button onclick="resizeImage()">
Resize Image
</button>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<br>

<a id="download"
class="download"
style="display:none;">
Download Image
</a>

</div>

<script>

let image = new Image();

let originalWidth = 0;
let originalHeight = 0;

const imageInput =
document.getElementById("imageInput");

const widthInput =
document.getElementById("width");

const heightInput =
document.getElementById("height");

const ratio =
document.getElementById("ratio");

const controls =
document.getElementById("controls");

const canvas =
document.getElementById("canvas");

const download =
document.getElementById("download");


imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        image.onload = function(){

            originalWidth = image.width;
            originalHeight = image.height;

            widthInput.value =
            originalWidth;

            heightInput.value =
            originalHeight;

            controls.style.display =
            "block";

        };

        image.src = e.target.result;

    };

    reader.readAsDataURL(file);

});


widthInput.addEventListener("input", function(){

    if(!ratio.checked) return;

    if(!originalWidth) return;

    const newWidth =
    parseInt(this.value);

    if(newWidth > 0){

        heightInput.value =
        Math.round(
            newWidth *
            originalHeight /
            originalWidth
        );

    }

});


heightInput.addEventListener("input", function(){

    if(!ratio.checked) return;

    if(!originalHeight) return;

    const newHeight =
    parseInt(this.value);

    if(newHeight > 0){

        widthInput.value =
        Math.round(
            newHeight *
            originalWidth /
            originalHeight
        );

    }

});


function resizeImage(){

    const width =
    parseInt(widthInput.value);

    const height =
    parseInt(heightInput.value);

    if(!width || !height){

        alert("Width এবং Height দিন।");

        return;
    }

    canvas.width = width;
    canvas.height = height;

    const ctx =
    canvas.getContext("2d");

    ctx.drawImage(
        image,
        0,
        0,
        width,
        height
    );

    canvas.style.display =
    "block";

    canvas.toBlob(function(blob){

        const url =
        URL.createObjectURL(blob);

        download.href = url;

        download.download =
        "jiggashahelp-resized-image.jpg";

        download.style.display =
        "inline-block";

    },"image/jpeg",0.90);

}

</script>

</body>
</html>
